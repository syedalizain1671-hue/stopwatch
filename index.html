<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StopWatch</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="outer_container">


        <div class="container">
            <h1>StopWatch</h1>
            <div class="stopwatch">

                <div class="timer">
                    <span id="sethour" class="hours">00</span>:
                    <span id="setminute" class="minutes">00</span>:
                    <span id="secondButton" class="seconds">00</span>
                </div>

                <div class="controllers">
                    <button class="start">Start</button>
                    <button class="stop">Stop</button>
                    <button class="lap">Lap</button>
                    <button class="reset">Reset</button>
                </div>
            </div>

            <!-- lap container start -->

            <div id="counter" class="lapper">
                Your recored time show here!
            </div>

            <footer class="footer">
                <p class="footer-title">Project 1: My first web development project</p>
                <p class="footer-text">Built with HTML, CSS and JavaScript</p>
                <p class="footer-journey">Project 1 → Final Project</p>
                <a class="footer-link" href="https://github.com/syedalizain1671-hue" target="_blank" rel="noopener">
                    View on GitHub
                </a>
            </footer>
        </div>
    </div>
    <script src="script.js"></script>
</body>

</html>
